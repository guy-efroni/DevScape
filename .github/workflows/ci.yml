name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/server/package-lock.json
            apps/client/package-lock.json
            packages/shared/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix apps/server ci
          npm --prefix apps/client ci

      - name: Build and test NestJS backend
        run: |
          npm run build --prefix apps/server
          npm test --prefix apps/server

      - name: Build and test Angular client (headless)
        run: |
          npm run build --prefix apps/client
          npm test --prefix apps/client -- --watch=false --browsers=ChromeHeadless

  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development
        run: echo "Deploy to development environment"

  deploy-prod:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploy to production environment"
