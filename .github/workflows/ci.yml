name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test NestJS backend
        run: |
          npm run build --prefix apps/api
          npm test --prefix apps/api

      - name: Build and test Angular client (headless)
        run: |
          npm run build --prefix apps/client
          npm test --prefix apps/client -- --watch=false --browsers=ChromeHeadless
