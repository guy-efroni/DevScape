<div class="canvas-wrapper">
  <div #cyContainer class="cy-viewport"></div>

  <div class="control-bar" role="toolbar" aria-label="Graph controls">
    <div class="segmented">
      <button
        type="button"
        class="seg"
        [class.active]="activeLayout() === LayoutDirection.DagreLeftToRight"
        (click)="setLayout(LayoutDirection.DagreLeftToRight)"
        title="Dagre horizontal"
      >Dagre-H</button>
      <button
        type="button"
        class="seg"
        [class.active]="activeLayout() === LayoutDirection.DagreTopToBottom"
        (click)="setLayout(LayoutDirection.DagreTopToBottom)"
        title="Dagre vertical"
      >Dagre-V</button>
      <button
        type="button"
        class="seg"
        [class.active]="activeLayout() === LayoutDirection.Grid"
        (click)="setLayout(LayoutDirection.Grid)"
        title="Grid"
      >Grid</button>
    </div>
    <span class="bar-sep" aria-hidden="true"></span>
    <span class="zoom-readout">{{ zoomPercent() }}%</span>
    <button type="button" class="bar-btn" (click)="fitView()" title="Fit to screen">Fit</button>
    <button type="button" class="bar-btn" (click)="fitView()" title="Reset view (⌘0)">
      <span class="bar-btn-label">Reset</span><span class="kbd">⌘0</span>
    </button>
  </div>

  <div class="legend" aria-label="Node legend">
    @for (item of legendCounts(); track item.label) {
      <span class="legend-pill" [attr.data-tone]="item.tone">
        <span class="legend-name">{{ item.label }}</span>
        <span class="legend-count mono">{{ item.count }}</span>
      </span>
    }
  </div>

  @if (selectedElement(); as el) {
    <app-inspector-card [selectedElement]="el" (closed)="selectedElement.set(null)" />
  }
</div>
